name: nursery_frontend
description: Minimal Flutter frontend for the Nursery Vendor Inventory & Settlement System.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.1
  path: ^1.9.0
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#EAF3E8"
  color_dark: "#EAF3E8"
  image: assets/branding/logo-option-plant-box.png
  branding: assets/branding/splash-branding.png
  branding_bottom_padding: 28
  android: true
  ios: true
  web: false
  fullscreen: true
